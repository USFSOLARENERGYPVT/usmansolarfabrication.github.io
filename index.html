<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USF | Usman Solar Fabrication</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #ffc107;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding: 60px 7%;
      background: linear-gradient(135deg, #111, #263238);
      color: white;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #ffc107;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 650px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      background: #ffc107;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      margin-right: 10px;
    }

    section {
      padding: 60px 7%;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h3 {
      margin: 12px 0;
    }

    .card p {
      color: #666;
      line-height: 1.5;
    }

    .contact {
      background: #111;
      color: white;
      text-align: center;
    }

    .contact p {
      margin: 12px 0;
      font-size: 18px;
    }

    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 18px;
      font-size: 14px;
    }
