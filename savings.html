<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>USF Solar Price Calculator</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #ffffff !important;
  background-image: none !important;
  font-family: Arial, sans-serif;
  color: #003366;
}

header {
  background: #003366;
  color: white;
  text-align: center;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header h2 {
  margin: 8px 0;
  font-size: 21px;
}

.flag {
  font-size: 35px;
}

.container {
  max-width: 600px;
  margin: 35px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

h3 {
  text-align: center;
  font-size: 24px;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: 2px solid #b8dff0;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  background: #008000;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #f2fbff;
  border: 2px solid #87ceeb;
  border-radius: 14px;
}

.result p {
  font-size: 18px;
  margin: 13px 0;
}

.price {
  color: #008000;
  font-size: 25px !important;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>USF ⚡</h1>
  <h2>Usman Solar Fabrication</h2>
  <div class="flag">🇮🇳</div>
</header>

<div class="container">

  <div class="card">

    <h3>☀️ Solar Price Calculator</h3>

    <label>Solar Capacity (kW)</label>

    <input
      type="number"
      id="kw"
      min="0.01"
      step="0.01"
      placeholder="Enter kW"
    >

    <label>Select Solar Panel</label>

    <select id="panel">
      <option value="540">540W Panel</option>
      <option value="580">580W Panel</option>
      <option value="585">585W Panel</option>
      <option value="610">610W Panel</option>
      <option value="615">615W Panel</option>
      <option value="620">620W Panel</option>
      <option value="710">710W Panel</option>
    </select>

    <button onclick="calculatePrice()">
      Calculate Price
    </button>

    <div class="result" id="result">

      <p>
        <strong>Panel:</strong>
        <span id="showPanel"></span>
      </p>

      <p>
        <strong>kW:</strong>
        <span id="showKW"></span>
      </p>

      <p class="price">
        Price: ₹<span id="showPrice"></span>
      </p>

    </div>

  </div>

</div>

<script>

function calculatePrice() {

  let kw = parseFloat(document.getElementById("kw").value);
  let panel = document.getElementById("panel").value;

  if (!kw || kw <= 0) {
    alert("Please enter solar kW");
    return;
  }

  let price = kw * 28000;

  document.getElementById("showPanel").innerText = panel + "W";
  document.getElementById("showKW").innerText = kw + " kW";
  document.getElementById("showPrice").innerText =
    Math.round(price).toLocaleString("en-IN");

  document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
